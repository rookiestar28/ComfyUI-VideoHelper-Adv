name: Publish to Comfy Registry

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Run authenticated preflight only, or publish after all gates pass
        required: true
        type: choice
        options:
          - preflight
          - publish
        default: preflight
      version:
        description: Must exactly match pyproject.toml
        required: true
        type: string
        default: "2.0.0"
      confirmation:
        description: For publish, enter PUBLISH comfyui-videohelper-adv 2.0.0
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: comfy-registry-release
  cancel-in-progress: false

jobs:
  validate-package:
    name: Validate exact Registry package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      RELEASE_OPERATION: ${{ inputs.operation }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Require the version tag for publish operation
        if: inputs.operation == 'publish'
        shell: bash
        env:
          EXPECTED_PUBLISH_REF: refs/tags/v${{ inputs.version }}
        run: test "$GITHUB_REF" = "$EXPECTED_PUBLISH_REF"

      - name: Validate metadata, ref, confirmation, and exact archive
        shell: bash
        run: >-
          python scripts/validate_release_metadata.py
          --expected-version "$RELEASE_VERSION"
          --operation "$RELEASE_OPERATION"
          --confirmation "$RELEASE_CONFIRMATION"
          --github-ref "$GITHUB_REF"
          --dry-run
          --archive "$RUNNER_TEMP/comfyui-videohelper-adv.zip"

      - name: Inspect exact archive independently
        shell: bash
        run: >-
          python scripts/inspect_release_archive.py
          "$RUNNER_TEMP/comfyui-videohelper-adv.zip"

  publish-node:
    name: Protected Registry preflight and optional publish
    needs: validate-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: comfy-registry-release
    env:
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      RELEASE_OPERATION: ${{ inputs.operation }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Require the version tag for publish operation
        if: inputs.operation == 'publish'
        shell: bash
        env:
          EXPECTED_PUBLISH_REF: refs/tags/v${{ inputs.version }}
        run: test "$GITHUB_REF" = "$EXPECTED_PUBLISH_REF"

      - name: Revalidate immutable release inputs before secret use
        shell: bash
        run: >-
          python scripts/validate_release_metadata.py
          --expected-version "$RELEASE_VERSION"
          --operation "$RELEASE_OPERATION"
          --confirmation "$RELEASE_CONFIRMATION"
          --github-ref "$GITHUB_REF"
          --dry-run
          --archive "$RUNNER_TEMP/comfyui-videohelper-adv.zip"

      - name: Verify protected environment bootstrap marker
        shell: bash
        env:
          RELEASE_ENVIRONMENT_PROTECTED: ${{ vars.RELEASE_ENVIRONMENT_PROTECTED }}
        run: test "$RELEASE_ENVIRONMENT_PROTECTED" = "true"

      - name: Authenticated read-only Registry ownership preflight
        shell: bash
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.COMFY_REGISTRY_RELEASE_TOKEN }}
        run: >-
          python scripts/registry_preflight.py
          --publisher rookiestar
          --node comfyui-videohelper-adv

      - name: Install reviewed Comfy CLI release
        if: inputs.operation == 'publish'
        shell: bash
        run: python -m pip install --disable-pip-version-check "comfy-cli==1.12.0"

      - name: Publish approved tag to Comfy Registry
        if: inputs.operation == 'publish'
        shell: bash
        env:
          COMFY_NO_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
          REGISTRY_ACCESS_TOKEN: ${{ secrets.COMFY_REGISTRY_RELEASE_TOKEN }}
        run: >-
          comfy --skip-prompt --no-enable-telemetry env comfy node publish
          --token "$REGISTRY_ACCESS_TOKEN"
